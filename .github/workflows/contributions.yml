name: Update Contribution Graph

on:
  # Manual trigger from the Actions tab
  workflow_dispatch:
  # Refresh weekly (Sunday 00:00 UTC) to keep the graph current
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

concurrency:
  group: update-contribution-graph
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate contribution SVGs from real GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTRIB_USER: ${{ github.repository_owner }}
        run: node .github/scripts/generate-contributions.mjs

      - name: Commit updated SVGs only when they change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-light.svg assets/contributions-dark.svg
          if git diff --cached --quiet; then
            echo "No contribution changes — nothing to commit."
          else
            git commit -m "chore: update contribution graph [skip ci]"
            git push
          fi
